[package]
name = "internet-canary"
version = "0.1.0"
edition = "2024"

[lints.rust]
warnings = "deny"

[lints.clippy]
pedantic = "deny"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
hostname = "0.4.2"
lettre = "0.11.23"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serenity = "0.12.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
uptime_lib = "0.3.1"
ureq = "3.5.0"
